name: release

# Builds the `coach` CLI as a native binary for each platform.
# - Tag push `vX.Y.Z` (must match .claude-plugin/plugin.json): builds and publishes a GitHub Release.
# - Manual run: builds only, binaries available as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches plugin.json version
        run: |
          manifest=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $manifest" >&2
            exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         platform: darwin-arm64 }
          - { runner: macos-15-intel,   platform: darwin-x64 }
          - { runner: ubuntu-24.04,     platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-latest,   platform: windows-x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build JVM distribution
        run: ./gradlew --no-daemon -q installDist
      - name: Build native binary
        run: |
          ni=native-image
          [ "$RUNNER_OS" = Windows ] && ni=native-image.cmd
          "$ni" -cp "build/install/coach/lib/*" -o "coach-${{ matrix.platform }}" MainKt
      - name: Smoke test
        run: |
          bin="./coach-${{ matrix.platform }}"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help | grep -q "auto-pair"
          mkdir -p smoke && touch smoke/coach-preferences.md
          out=$(cd smoke && env -u INTERVALS_API_KEY "../$bin" get /athlete/0 2>&1 || true)
          echo "$out" | grep -q "Missing INTERVALS_API_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: coach-${{ matrix.platform }}
          path: cli/coach-${{ matrix.platform }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum coach-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
